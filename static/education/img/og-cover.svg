<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">БТЖТиС — веб-система контроля учебного процесса</title>
  <desc id="desc">Обложка для OpenGraph страниц системы БТЖТиС.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfaf6"/>
      <stop offset="100%" stop-color="#efe8d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.1" r="0.55">
      <stop offset="0%" stop-color="#cb7c2f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#cb7c2f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="72" y="72" width="1056" height="486" rx="36" fill="#fffdf8" stroke="#dccfb9" stroke-width="2"/>
  <rect x="112" y="118" width="330" height="56" rx="28" fill="#e8edf3"/>
  <text x="144" y="155" fill="#124e78" font-size="32" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
